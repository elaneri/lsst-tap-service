services:
  proxy:
    image: nginx:alpine
    ports:
      - '80:80'
    networks:
      - tap-network
    volumes:
      - './proxy/default.conf:/etc/nginx/conf.d/default.conf'
    depends_on:
      - lsst-tap-service

  lsst-tap-service:
    image: lsstdax/lsst-tap-service:dev
    depends_on:
      mock-qserv:
        condition: service_healthy
      tap-schema-db:
        condition: service_healthy
      uws-db:
        condition: service_healthy
    ports:
      - '8080:8080'
      - '5555:5555'
    networks:
      - tap-network
    environment:
      BACKEND: "pg"
      CATALINA_OPTS: >-
        -Dqservuser.username=qsmaster
        -Dqservuser.password=
        -Dqservuser.driverClassName=com.mysql.cj.jdbc.Driver
        -Dqservuser.url=jdbc:mysql://mock-qserv:3306/
        -Dqservuser.maxActive=100
        -Dtapschemauser.username=TAP_SCHEMA
        -Dtapschemauser.password=TAP_SCHEMA
        -Dtapschemauser.driverClassName=org.postgresql.Driver
        -Dtapschemauser.url=jdbc:postgresql://tap-schema-db:5432/tap_schema
        -Dtapschemauser.maxActive=100
        -Dtap.username=postgres
        -Dtap.driverClassName=org.postgresql.Driver
        -Dtap.url=jdbc:postgresql://uws-db/
        -Dtap.maxActive=100
        -Dtapadm.maxActive=100
        -Duws.username=postgres
        -Duws.driverClassName=org.postgresql.Driver
        -Duws.url=jdbc:postgresql://uws-db/
        -Duws.maxActive=100
        -Dca.nrc.cadc.util.PropertiesReader.dir=/config/
        -Dpath_prefix=/
        -Dbase_url=http://localhost/tap
        -Dtomcat.connector.connectionTimeout=20000
        -Dtomcat.connector.keepAliveTimeout=120000
        -Dtomcat.connector.secure=false
        -Dtomcat.connector.scheme=http
        -Dtomcat.connector.proxyName=localhost
        -Dtomcat.connector.proxyPort=80
        -Dgcs_bucket=async-results.lsst.codes
        -Dgcs_bucket_url=https://tap-files.lsst.codes
        -Dgcs_bucket_type=GCS
      GOOGLE_APPLICATION_CREDENTIALS: "/etc/google_creds.json"
    volumes:
      - './google_creds.json:/etc/google_creds.json'

  uws-db:
    image: lsstdax/uws-db:dev
    ports:
      - '5432:5432'
    networks:
      - tap-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  tap-schema-db:
    image: postgres:16-alpine
    ports:
      - '5433:5432'
    networks:
      - tap-network
    environment:
      POSTGRES_DB: "tap_schema"
      POSTGRES_USER: "TAP_SCHEMA"
      POSTGRES_PASSWORD: "TAP_SCHEMA"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U TAP_SCHEMA -d tap_schema"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mock-qserv:
    image: lsstdax/mock-qserv:dev
    networks:
      - tap-network
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=socket -uqsmaster -e 'SELECT 1' >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

networks:
  tap-network:
